<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">


<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#14141c; color:#fff; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; padding-bottom: 70px; }
  .screen { display:none; padding: 20px 16px; flex:1; }
  .screen.active { display:block; }
  h1,h2,h3 { margin: 0 0 12px; }

  input, select { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#0f0f17; color:#fff; margin-bottom:12px; }
  .btn { display:block; width:100%; padding:14px; border-radius:12px; border:none; background:#5b4bdb; color:#fff; font-weight:600; text-align:center; cursor:pointer; }
  .btn.secondary { background:#2a2a3a; }
  .btn.small { width:auto; padding:10px 16px; display:inline-block; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .subject-tile { background:#1e1e2b; border-radius:14px; padding:18px 10px; text-align:center; cursor:pointer; border:1px solid #2a2a3a; }
  .subject-tile:active { background:#2a2a3a; }
  .level-card { background:#1e1e2b; border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; border:2px solid transparent; }
  .level-card.sel { border-color:#5b4bdb; }
  .level-card small { color:#9a9ab0; }
  #bottomNav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:#1a1a25; display:flex; border-top:1px solid #2a2a3a; }
  .navBtn { flex:1; text-align:center; padding:10px 0 8px; color:#8a8aa0; cursor:pointer; font-size:12px; }
  .navBtn.active { color:#8d7dff; }
  .navBtn .ic { font-size:20px; display:block; margin-bottom:2px; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .topbar .back { cursor:pointer; font-size:22px; }
  .muted { color:#9a9ab0; font-size:14px; }
